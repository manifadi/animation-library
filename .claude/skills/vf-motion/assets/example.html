<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vf-motion – Minimalbeispiel</title>
<script>document.documentElement.classList.add('vfm-js')</script>
<link rel="stylesheet" href="vf-motion.css">
<script src="vf-motion.js" defer></script>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; overflow-x: clip; }
  main { max-width: 1100px; margin: 0 auto; padding: 4rem 1.5rem 50vh; }
  .btn { display: inline-flex; gap: .5rem; align-items: center; background: #000; color: #fff;
         border: 0; border-radius: 999px; padding: 1.1rem 2.2rem; font-family: inherit; font-weight: 500; font-size: 1rem; line-height: 1; text-decoration: none; cursor: pointer; }
  .lead { font-size: clamp(1.5rem, 3vw, 2.4rem); line-height: 1.28; max-width: 30ch; margin: 40vh 0; }
  figure { margin: 0; aspect-ratio: 16/9; }
  figure img { width: 100%; height: 100%; object-fit: cover; display: block; }
</style>
</head>
<body>
<main>
  <a href="#" class="btn" data-motion="wave">Kontakt aufnehmen</a>
  <button type="button" class="btn" data-motion="wave">Mehr erfahren</button>

  <p class="lead" data-motion="lift">Gute Möbel entstehen nicht am Fließband, sondern in der <a href="#">Werkstatt</a>. Jedes Stück wird auf den Zentimeter genau geplant und von Hand veredelt.</p>

  <figure data-motion="curtain">
    <img src="https://picsum.photos/1600/900" alt="Beispielbild">
  </figure>

  <div data-motion="curtain" data-curtain-full style="margin-top:40vh">
    <img src="https://picsum.photos/1920/1080" alt="Fullscreen-Beispiel">
  </div>
</main>
</body>
</html>

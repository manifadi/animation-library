<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MHK: Die Koje</title>
<meta name="description" content="Drei Versionen der Landing Page „Die Koje“ für musterhaus küchen, jeweils mit geschätztem Aufwand." />
<link rel="icon" href="assets/mhk-logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<!-- Figma nutzt „Dashiell Bright Black" (Adobe Fonts). Fraunces 900 dient als frei verfügbarer Ersatz. -->
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,800;9..144,900&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --red: #e30613;
    --red-dark: #b8050f;
    --ink: #3c3c3c;
    --ink-soft: #6b6b6b;
    --bg: #ffffff;
    --bg-soft: #f5f5f5;
    --line: #e2e2e2;
    --serif: "Dashiell Bright", "Fraunces", Georgia, serif;
    --sans: "Open Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --gutter: clamp(16px, 4vw, 40px);
    --edge: clamp(12px, 1.9vw, 21px);
    --header: 56px;
    --ease: cubic-bezier(.22, .61, .36, 1);
    --ease-out: cubic-bezier(.16, 1, .3, 1);
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  img, video { display: block; max-width: 100%; }
  a { color: inherit; }

  .serif {
    font-family: var(--serif);
    font-weight: 900;
    font-variation-settings: "opsz" 144;
    letter-spacing: -0.01em;
    line-height: 1.04;
  }
  .accent { color: var(--red); }

  /* ---------- Header ---------- */
  .site-header {
    position: relative;
    z-index: 5;
    display: flex;
    align-items: center;
    height: var(--header);
    padding: 0 var(--gutter);
    background: var(--bg);
  }
  .logo {
    position: absolute;
    top: 0;
    left: var(--gutter);
    width: clamp(84px, 9vw, 120px);
    box-shadow: 0 10px 30px rgba(0, 0, 0, .18);
  }
  .logo img { width: 100%; height: auto; }

  /* ---------- Stage: Kachel (2/3) + Versionsliste (1/3) ---------- */
  .stage {
    display: grid;
    grid-template-columns: minmax(0, 2fr) minmax(0, 1fr);
    gap: var(--edge);
    height: calc(100vh - var(--header));
    height: calc(100svh - var(--header));
    min-height: 560px;
    padding: 0 var(--edge) var(--edge);
  }

  /* ---------- Linke Kachel ---------- */
  .tile {
    position: relative;
    overflow: hidden;
    background: #1d1d1d;
    color: #fff;
    isolation: isolate;
  }
  .tile-video,
  .tile-thumb {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .tile-video { z-index: 0; transform: scale(1.02); transition: transform 1.2s var(--ease-out), filter .8s var(--ease); }
  .tile.is-version .tile-video { transform: scale(1.08); filter: saturate(.85); }

  /* Vorschaubild der Version: wischt von rechts über das Video */
  .tile-thumb {
    z-index: 1;
    clip-path: inset(0 0 0 100%);
    transform: scale(1.06);
    transition: clip-path .75s var(--ease-out), transform 1.2s var(--ease-out);
  }
  .tile-thumb.is-active { clip-path: inset(0 0 0 0); transform: scale(1); }

  .tile::after {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    background:
      linear-gradient(90deg, rgba(0,0,0,.66) 0%, rgba(0,0,0,.38) 48%, rgba(0,0,0,.08) 100%),
      linear-gradient(0deg, rgba(0,0,0,.45) 0%, rgba(0,0,0,0) 45%);
    transition: opacity .6s var(--ease);
  }
  .tile.is-version::after { opacity: 1; }

  .panel {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 3;
    padding: clamp(28px, 5vw, 72px);
    pointer-events: none;
  }
  .panel > * {
    opacity: 0;
    transform: translateY(18px);
    transition: opacity .35s var(--ease), transform .35s var(--ease);
  }
  .panel.is-active { pointer-events: auto; }
  .panel.is-active > * {
    opacity: 1;
    transform: none;
    transition: opacity .6s var(--ease-out), transform .7s var(--ease-out);
  }
  .panel.is-active > *:nth-child(2) { transition-delay: .06s; }
  .panel.is-active > *:nth-child(3) { transition-delay: .12s; }
  .panel.is-active > *:nth-child(4) { transition-delay: .18s; }
  .panel.is-active > *:nth-child(5) { transition-delay: .24s; }

  .eyebrow {
    display: inline-block;
    margin: 0 0 18px;
    padding: 6px 12px;
    background: var(--red);
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .04em;
    text-transform: uppercase;
  }
  .panel h1 { margin: 0; font-size: clamp(52px, 8.4vw, 124px); }
  .panel h2 { margin: 0; max-width: 16ch; font-size: clamp(36px, 4.6vw, 72px); }
  .lede {
    margin: 16px 0 0;
    max-width: 40ch;
    font-size: clamp(17px, 1.5vw, 21px);
  }
  .panel .desc {
    margin: 16px 0 0;
    max-width: 52ch;
    font-size: clamp(15px, 1.2vw, 18px);
  }

  .features {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 22px 0 0;
    padding: 0;
    list-style: none;
  }
  .features li {
    padding: 6px 12px;
    border: 1px solid rgba(255,255,255,.45);
    font-size: 13px;
    font-weight: 600;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    background: rgba(0,0,0,.18);
  }

  .meta {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    gap: 14px 40px;
    margin-top: 28px;
    padding-top: 20px;
    border-top: 1px solid rgba(255,255,255,.28);
  }
  .meta-label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .06em;
    text-transform: uppercase;
    opacity: .75;
  }
  .meta-cost { font-size: clamp(30px, 3vw, 44px); }
  .meta-status {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-size: 15px;
    font-weight: 600;
    text-decoration: none;
  }
  a.meta-status svg { transition: transform .25s ease; }
  a.meta-status:hover svg { transform: translateX(4px); }
  .meta-status .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #3ecf6e;
    box-shadow: 0 0 0 4px rgba(62,207,110,.22);
  }
  .meta-status.is-pending .dot { background: #f2b33d; box-shadow: 0 0 0 4px rgba(242,179,61,.22); }

  /* ---------- Rechte Spalte: Versionsliste ---------- */
  .versions {
    display: flex;
    flex-direction: column;
    min-height: 0;
    background: var(--bg-soft);
  }
  .versions-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    padding: clamp(20px, 2.4vw, 32px) clamp(20px, 2.4vw, 32px) 14px;
    border-bottom: 1px solid var(--line);
  }
  .versions-head h2 { margin: 0; font-size: clamp(26px, 2.4vw, 36px); }
  .versions-head span { font-size: 13px; color: var(--ink-soft); }

  .vlist { display: flex; flex-direction: column; flex: 1; margin: 0; padding: 0; list-style: none; }
  .vlist li { display: flex; flex: 1; border-bottom: 1px solid var(--line); }
  .vlist li:last-child { border-bottom: 0; }

  .vitem {
    position: relative;
    display: grid;
    grid-template-columns: auto minmax(0, 1fr) auto;
    grid-template-rows: auto auto;
    align-content: center;
    column-gap: clamp(14px, 1.6vw, 22px);
    row-gap: 4px;
    width: 100%;
    padding: 18px clamp(20px, 2.4vw, 32px);
    color: var(--ink);
    text-decoration: none;
    overflow: hidden;
    cursor: pointer;
    outline: none;
    -webkit-tap-highlight-color: transparent;
  }
  /* Rote Fläche fährt beim Hover von links herein */
  .vitem::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 0;
    background: var(--red);
    transform: scaleX(0);
    transform-origin: left center;
    transition: transform .55s var(--ease-out);
  }
  .vitem > * { position: relative; z-index: 1; transition: color .35s var(--ease), transform .55s var(--ease-out); }

  .vnum {
    grid-row: 1 / 3;
    align-self: center;
    font-size: clamp(40px, 4vw, 64px);
    color: #cfcfcf;
  }
  .vtitle {
    align-self: end;
    margin: 0;
    font-size: clamp(19px, 1.65vw, 25px);
    line-height: 1.15;
    color: var(--red);
  }
  .vsub {
    grid-column: 2;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px 10px;
    font-size: 13px;
    color: var(--ink-soft);
  }
  .vcost {
    padding: 2px 8px;
    background: #fff;
    border: 1px solid var(--line);
    font-weight: 700;
    color: var(--ink);
    transition: background-color .35s var(--ease), border-color .35s var(--ease), color .35s var(--ease);
  }
  .vgo {
    grid-column: 3;
    grid-row: 1 / 3;
    align-self: center;
    color: var(--red);
  }
  .vtag {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .06em;
    text-transform: uppercase;
    white-space: nowrap;
    color: var(--ink-soft);
  }

  .vitem.is-active::before { transform: scaleX(1); }
  .vitem.is-active > * { color: #fff; }
  .vitem.is-active .vnum { transform: translateX(4px); color: rgba(255,255,255,.55); }
  .vitem.is-active .vtitle { transform: translateX(6px); }
  .vitem.is-active .vsub { transform: translateX(6px); color: rgba(255,255,255,.85); }
  .vitem.is-active .vcost { background: rgba(255,255,255,.14); border-color: rgba(255,255,255,.4); color: #fff; }
  .vitem.is-active .vgo { transform: translateX(6px); }
  .vitem.is-active .vtag { color: #fff; }
  .vitem:focus-visible { box-shadow: inset 0 0 0 3px var(--ink); }

  .versions-foot {
    padding: 14px clamp(20px, 2.4vw, 32px);
    border-top: 1px solid var(--line);
    font-size: 12px;
    color: var(--ink-soft);
  }

  /* ---------- Responsive ---------- */
  @media (max-width: 900px) {
    .stage {
      grid-template-columns: 1fr;
      height: auto;
      min-height: 0;
    }
    .tile { min-height: 72svh; min-height: max(72vh, 480px); }
    .vlist li { flex: none; }
    .vitem { padding-top: 22px; padding-bottom: 22px; }
  }
  @media (max-width: 560px) {
    .panel h2 { font-size: 34px; }
    .meta { gap: 12px 28px; }
    .versions-head span { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; }
  }
</style>
</head>
<body>

<header class="site-header">
  <a class="logo" href="./" aria-label="musterhaus küchen – Die Koje">
    <img src="assets/mhk-logo.png" alt="musterhaus küchen – Gehören zum Leben." width="285" height="296" />
  </a>
</header>

<main class="stage">
  <section class="tile" id="tile" aria-live="polite">
    <video class="tile-video" id="tileVideo" src="assets/MHK%20v2%20(1).mp4" poster="assets/koje-bild.jpg"
           autoplay muted loop playsinline preload="auto" aria-hidden="true"></video>

    <div class="panel is-active" data-panel="intro">
      <span class="eyebrow">Landing Page · 3 Versionen</span>
      <h1 class="serif">Die Koje.</h1>
      <p class="lede">Drei Entwürfe, eine Idee. Jede Version zeigt, wie die Landing Page aussehen kann und welcher Aufwand dahintersteckt.</p>
    </div>
  </section>

  <aside class="versions" aria-labelledby="versionsTitle">
    <div class="versions-head">
      <h2 id="versionsTitle" class="serif">Versionen</h2>
      <span>Darüberfahren für Details</span>
    </div>
    <ol class="vlist" id="vlist"></ol>
    <p class="versions-foot">Alle Beträge sind geschätzter Aufwand für die Umsetzung.</p>
  </aside>
</main>

<script src="versions.js"></script>
<script>
  (function () {
    var versions = window.KOJE_VERSIONS || [];
    var tile = document.getElementById("tile");
    var list = document.getElementById("vlist");
    var video = document.getElementById("tileVideo");
    var arrow = '<svg width="30" height="10" viewBox="0 0 30 10" fill="none" aria-hidden="true"><path d="M0 5h29m0 0-4-4m4 4-4 4" stroke="currentColor" stroke-width="1.4"/></svg>';

    function esc(s) {
      return String(s).replace(/[&<>"]/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
      });
    }

    var items = [];
    var panels = [tile.querySelector('[data-panel="intro"]')];
    var thumbs = [];

    versions.forEach(function (v, i) {
      var n = "0" + (i + 1);
      var ready = !!v.slug;

      // Listeneintrag
      var li = document.createElement("li");
      var el = document.createElement(ready ? "a" : "div");
      el.className = "vitem";
      if (ready) {
        el.href = v.slug + "/";
      } else {
        el.tabIndex = 0;
        el.setAttribute("role", "button");
        el.setAttribute("aria-disabled", "true");
      }
      el.innerHTML =
        '<span class="vnum serif">' + n + "</span>" +
        '<h3 class="vtitle serif">' + esc(v.title) + "</h3>" +
        '<span class="vsub"><span class="vcost">' + esc(v.cost) + "</span>" + esc(v.short || "") + "</span>" +
        (ready ? '<span class="vgo">' + arrow + "</span>" : '<span class="vgo vtag">In Planung</span>');
      li.appendChild(el);
      list.appendChild(li);
      items.push(el);

      // Vorschaubild für die Kachel
      if (ready && v.thumbnail) {
        var img = document.createElement("img");
        img.className = "tile-thumb";
        img.src = v.slug + "/" + v.thumbnail;
        img.alt = "";
        img.decoding = "async";
        tile.insertBefore(img, panels[0]);
        thumbs[i] = img;
      }

      // Info-Panel in der Kachel
      var panel = document.createElement("div");
      panel.className = "panel";
      panel.innerHTML =
        '<span class="eyebrow">Version ' + n + "</span>" +
        '<h2 class="serif">' + esc(v.title) + "</h2>" +
        '<p class="desc">' + esc(v.description || "") + "</p>" +
        '<ul class="features">' + (v.features || []).map(function (f) { return "<li>" + esc(f) + "</li>"; }).join("") + "</ul>" +
        '<div class="meta">' +
          '<div><span class="meta-label">Geschätzter Aufwand</span><span class="meta-cost serif">' + esc(v.cost) + "</span></div>" +
          (ready
            ? '<a class="meta-status" href="' + esc(v.slug) + '/"><span class="dot"></span>Klickdummy ansehen ' + arrow + "</a>"
            : '<span class="meta-status is-pending"><span class="dot"></span>In Planung, noch nicht umgesetzt</span>') +
        "</div>";
      tile.appendChild(panel);
      panels.push(panel);
    });

    // Aktiven Zustand setzen: -1 = Intro, sonst Index der Version
    var current = -1;
    var leaveTimer = null;

    function setActive(i) {
      clearTimeout(leaveTimer);
      if (i === current) return;
      current = i;
      items.forEach(function (el, k) { el.classList.toggle("is-active", k === i); });
      panels.forEach(function (p, k) { p.classList.toggle("is-active", k === i + 1); });
      thumbs.forEach(function (t, k) { if (t) t.classList.toggle("is-active", k === i); });
      tile.classList.toggle("is-version", i >= 0);
    }

    function scheduleReset() {
      clearTimeout(leaveTimer);
      leaveTimer = setTimeout(function () { setActive(-1); }, 180);
    }

    var canHover = window.matchMedia("(hover: hover)").matches;

    items.forEach(function (el, i) {
      el.addEventListener("mouseenter", function () { setActive(i); });
      el.addEventListener("focus", function () { setActive(i); });
      el.addEventListener("blur", scheduleReset);

      // Touch: erster Tipp zeigt die Details in der Kachel, zweiter Tipp öffnet die Version
      el.addEventListener("click", function (e) {
        if (!canHover && current !== i) {
          e.preventDefault();
          setActive(i);
          if (window.innerWidth <= 900) tile.scrollIntoView({ behavior: "smooth", block: "start" });
          return;
        }
        if (el.tagName !== "A") {
          e.preventDefault();
          setActive(current === i && !canHover ? -1 : i);
        }
      });
      el.addEventListener("keydown", function (e) {
        if (el.tagName !== "A" && (e.key === "Enter" || e.key === " ")) {
          e.preventDefault();
          setActive(i);
        }
      });
    });
    list.addEventListener("mouseleave", scheduleReset);
    // Solange die Maus auf der Kachel ist, bleibt die Version stehen (Link „Klickdummy ansehen“ erreichbar)
    tile.addEventListener("mouseenter", function () { if (current >= 0) clearTimeout(leaveTimer); });
    tile.addEventListener("mouseleave", scheduleReset);

    // Video bei reduzierter Bewegung anhalten
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
      video.removeAttribute("autoplay");
      video.pause();
    }
  })();
</script>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-label="Animation: Eine Schublade mit Ladestation für Handys öffnet sich [Platzhalter]."><defs><pattern id="la-oak" width="60" height="200" patternUnits="userSpaceOnUse"><rect width="60" height="200" fill="#c99a6a"/><path d="M8 0 C12 60 4 120 9 200 M22 0 C18 70 26 140 21 200 M37 0 C41 50 33 130 38 200 M51 0 C47 80 55 150 50 200" stroke="#a77a4e" stroke-opacity=".3" stroke-width="1.4" fill="none"/></pattern></defs><style>
.la-drw{animation:la-drw 5.5s cubic-bezier(.65,0,.35,1) infinite}
.la-bolt{animation:la-bolt 1.4s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
